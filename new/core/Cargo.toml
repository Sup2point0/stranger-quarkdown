[package]
name = "squarkdown"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
dunce = "1.0.5"
enum-display = "0.2.1"
enum_stringify = "0.6.5"
glob = "0.3.4"
kiam = "0.1.1"
lazy_static = "1.5.0"
path-slash = "0.2.1"
pathdiff = "0.2.3"
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "22.0.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "parsing", "serde"] }
tinyvec = { version = "1.12.0", features = ["alloc", "serde"] }
toml = "1.1.4"
utf8-chars = "3.0.7"
walkdir = "2.5.0"

[dev-dependencies]
assertables = "10.1.0"
indoc = "2.0.7"

[lints.clippy]
partialeq_to_none = "allow"

# pedantic = { level = "warn", priority = -1 }
# doc-markdown = "allow"
# missing-errors-doc = "allow"
# missing-panics-doc = "allow"
# semicolon-if-nothing-returned = "allow"
# uninlined-format-args = "allow"
# wildcard_imports = "allow"
