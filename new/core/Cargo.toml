[package]
name = "squarkdown"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
enum_stringify = "0.6.5"
lazy_static = "1.5.0"
thiserror = "2.0.20"
tinyvec = { version = "1.12.0", features = ["alloc"] }

[lints.clippy]
partialeq_to_none = "allow"
