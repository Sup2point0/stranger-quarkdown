[package]
name = "squarkdown"
version = "4.0.0-alpha.2"
edition = "2024"
license = "MIT"

description = "Markdown preprocessing for SvelteKit projects"
keywords = ["svelte", "sveltekit", "mdsvex", "markdown", "squark"]
repository = "https://github.com/Sup2point0/stranger-quarkdown"
homepage = "https://sup2point0.github.io/stranger-quarkdown"
documentation = "https://sup2point0.github.io/stranger-quarkdown/docs"

exclude = [
	"tests/",
	"src/readme.md"
]

[profile.release]
lto = true
strip = true

[profile.dev]
debug = "line-tables-only"

[dependencies]
enum-display = "0.2.1"
enum_stringify = "0.6.5"
path-clean = "1.0.1"
path-slash = "0.2.1"
path_macro = "1.0.0"
pathdiff = "0.2.3"
pulldown-cmark = "0.13.4"
pulldown-cmark-to-cmark = "22.0.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3.24.0"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tinyvec = { version = "1.12.0", features = ["alloc", "serde"] }
toml = "1.1.4"
walkdir = "2.5.0"

[dev-dependencies]
assertables = "10.1.0"
indoc = "2.0.7"
lazy_static = "1.5.0"

[lints.clippy]
partialeq_to_none = "allow"
upper-case-acronyms = "allow"

# pedantic = { level = "warn", priority = -1 }
# doc-markdown = "allow"
# missing-errors-doc = "allow"
# missing-panics-doc = "allow"
# semicolon-if-nothing-returned = "allow"
# uninlined-format-args = "allow"
# wildcard_imports = "allow"
