#:schema ../squarkdown/src/config/schema.json

[errors]
strict = true
debug = true
on-error = "kill"
file-already-exists = "overwrite"
# broken-link = "link-to-github"
broken-link = "error"

[paths]
site = "/site/"
sources = [
	"/",
	"/docs/",
	"/.squarkdown/content/",
]

[out]
folder = "src/routes/(docs)/(dyna)/"
file-name = "+page.svx"
site-data-path = "src/site.json"
render-page-ts = true
shorter-fields = false

[format]
preserve-comments = true
externalise-links = true

[fonts]
queries = [
	"Sora:wght@100..800",
]
