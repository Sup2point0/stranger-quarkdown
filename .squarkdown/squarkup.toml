#:schema ../new/core/src/config/schema.json

[errors]
strict = true
on-error = "warn"
file-already-exists = "overwrite"
# inactive-link = "link-to-github"
inactive-link = "error"

[paths]
site = "/site/"
sources = [
	"/",
	"/docs/",
	"/.squarkdown/content/",
]

[out]
folder = "src/routes/(docs)/(dyna)/"
file-name = "+page.svx"
site-data-path = "src/site.json"

[format]
preserve-comments = true
externalise-links = true
mark-invalid-links = true

# [styles]
# folder = "src/styles/"
# base-file = "article.scss"

[assets]
folder = "/.assets/"
site-assets-folder = "/.assets/site/"
extensions = [
	"svg",
	"ttf"
]

