#:schema ../squarkdown/src/config/schema.json

[project]
name = "Stranger Quarkdown"
github = "Sup2point0/stranger-quarkdown"

[errors]
strict = true
debug = true
on-error = "kill"
file-already-exists = "overwrite"
link-inactive = "link-to-github"
link-broken = "error"

[paths]
site = "/site/"
sources = [
	"/",
	"/docs/",
	"/.squarkdown/content/",
]

[out]
folder = "src/routes/(docs)/(dyna)/"
file-name = "+page.svx"
site-data-path = "src/site.json"
render-page-ts = true
shorter-fields = false

[format]
inject-head = true
preserve-heading = false
preserve-comments = true
externalise-links = true
escape-angles = true
escape-braces = true
repair-tables = true

[fonts]
queries = [
	"Sora:wght@100..800",
]
